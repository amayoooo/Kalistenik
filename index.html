<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalistenik Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Program latihan kalistenik dari Basic hingga Expert, plus latihan Pelvic Floor.">
<meta name="theme-color" content="#0F1215">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalistenik">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell satu kolom (maks 520px), header sticky + tab bar bawah; sesi latihan = layar penuh.
   Arah desain: lantai gym karet grafit + kapur putih, satu aksen oranye sinyal. Warna level = semantik. */
:root{
  --bg:#0F1215; --surface:#171B20; --surface-2:#1F252C; --line:#2A323B;
  --fg:#EEF1F4; --muted:#8C96A1; --accent:#FF6A2B; --accent-ink:#1A0B03; --accent-soft:rgba(255,106,43,.14);
  --l1:#3DD68C; --l2:#4DA3FF; --l3:#FFB020; --l4:#FF4D5E; --pelvic:#B58CFF;
  --ok:#3DD68C; --shadow:0 12px 32px rgba(0,0,0,.45);
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:10px;
  --anim-fig:var(--fg); --anim-far:color-mix(in srgb,var(--muted) 62%,var(--bg)); --anim-prop:var(--muted); --anim-prop-fill:var(--surface-2); --anim-floor:var(--line);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#E9ECEF; --line:#D7DCE1;
  --fg:#11151A; --muted:#5B6570; --accent:#E5541A; --accent-ink:#FFFFFF; --accent-soft:rgba(229,84,26,.12);
  --l1:#13A866; --l2:#1F7BE0; --l3:#C98100; --l4:#E02D40; --pelvic:#7B4FD6; --ok:#13A866; --shadow:0 12px 28px rgba(20,30,40,.14);
  color-scheme:light } }
:root[data-theme="light"]{
  --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#E9ECEF; --line:#D7DCE1;
  --fg:#11151A; --muted:#5B6570; --accent:#E5541A; --accent-ink:#FFFFFF; --accent-soft:rgba(229,84,26,.12);
  --l1:#13A866; --l2:#1F7BE0; --l3:#C98100; --l4:#E02D40; --pelvic:#7B4FD6; --ok:#13A866; --shadow:0 12px 28px rgba(20,30,40,.14);
  color-scheme:light }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

.app{max-width:520px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px;stroke:var(--accent-ink);color:var(--accent-ink)}
.brand b{white-space:nowrap;font-family:var(--f-display);font-size:21px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.brand b span{color:var(--accent)}
.lvchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap}
.lvchip i{width:8px;height:8px;border-radius:50%;background:var(--lvc,var(--l1))}

/* Views */
.view{display:flex;flex-direction:column;gap:18px;padding-top:6px;animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-h h2{font-size:22px;text-transform:uppercase}
.link{color:var(--accent);font-weight:700;font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* Hero today */
.hero{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px}
.hero::after{content:attr(data-lv);position:absolute;right:-6px;top:-22px;font-family:var(--f-display);font-weight:800;font-size:150px;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--line);pointer-events:none;letter-spacing:-.02em}
.hero > *{position:relative;z-index:1}
.hero h1{font-size:44px;text-transform:uppercase;margin-top:6px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--muted)}
.hero .meta b{color:var(--fg);font-weight:700}
.exlist{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column}
.exlist li{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.exlist .ix{font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:15px}
.exlist .nm{font-weight:600;min-width:0}
.exlist .nm small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.exlist .rx{font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:12px;font-weight:700;font-size:15px;letter-spacing:.01em;transition:transform .1s ease,background .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface-2);color:var(--fg)}
.btn-line{border:1px solid var(--line);color:var(--fg)}
.btn-block{width:100%}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:10px}
.row > *{flex:1}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;color:var(--muted);margin-left:2px}
.stat .k{font-size:11px;color:var(--muted);font-weight:600;margin-top:6px;letter-spacing:.04em;text-transform:uppercase}

/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:10px;font-size:11px;font-weight:700;color:var(--muted)}
.wd .dot{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center}
.wd.plan .dot{border:1.5px solid var(--muted)}
.wd.done .dot{background:var(--accent);border-color:var(--accent)}
.wd.done .dot svg{stroke:var(--accent-ink)}
.wd.today{background:var(--surface);color:var(--fg)}
.wd .dot svg{width:14px;height:14px;stroke:var(--fg);fill:none;stroke-width:3}

/* Banner level up */
.banner{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--accent)}
.banner p{margin:0;font-size:13px;flex:1;min-width:0}
.banner b{display:block;font-size:15px}

/* Kegel quick card */
.pcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.pcard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--pelvic) 16%,transparent);flex:none}
.pcard .ic svg{width:22px;height:22px;stroke:var(--pelvic)}
.pcard .tx{flex:1;min-width:0}
.pcard .tx b{display:block;font-size:15px}
.pcard .tx span{font-size:12px;color:var(--muted)}
.chev{width:18px;height:18px;stroke:var(--muted);flex:none}

/* Segmented */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px))}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* Program schedule */
.days{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;width:100%}
.day.rest{background:transparent;border-style:dashed}
.day.is-today{border-color:var(--accent)}
.day .dn{font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;color:var(--muted)}
.day.is-today .dn{color:var(--accent)}
.day .dt b{display:block;font-family:var(--f-display);font-size:20px;text-transform:uppercase;line-height:1.1}
.day .dt span{font-size:12px;color:var(--muted)}
.lvinfo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lvinfo div{min-width:0}
.lvinfo dt{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.lvinfo dd{margin:2px 0 0;font-weight:600;font-size:14px}

/* Skill map */
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cat-head h2{font-size:30px;text-transform:uppercase}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.tier{display:flex;flex-direction:column;gap:0}
.tier-h{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.tier-h .tag{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;padding:2px 8px;border-radius:6px;color:var(--bg);background:var(--c)}
.tier-h .tag.dim{background:var(--surface-2);color:var(--muted)}
.tier-h small{color:var(--muted);font-size:12px}
.node{position:relative;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 0;text-align:left;width:100%}
.node::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:2px;background:var(--line)}
.tier .node:first-of-type::before{top:50%}
.tier .node:last-of-type::before{bottom:50%}
.node .st{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--line)}
.node .st svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2.5}
.node.open .st{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.node.open .st svg{stroke:var(--accent)}
.node.done .st{border-color:var(--ok);background:var(--ok)}
.node.done .st svg{stroke:var(--bg)}
.node .nm{font-weight:600;min-width:0}
.node.locked .nm{color:var(--muted)}
.node .nm small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.node .tg{font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap;color:var(--muted)}
.node.open .tg{color:var(--fg)}

/* Progress */
.chart{width:100%;height:auto;display:block}
.hist{display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.hist ul{list-style:none;margin:0;padding:0}
.hist .d{font-family:var(--f-display);text-align:center;line-height:1}
.hist .d b{display:block;font-size:24px}
.hist .d small{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.hist .t b{display:block;font-weight:600}
.hist .t span{font-size:12px;color:var(--muted)}
.cats{display:flex;flex-direction:column;gap:12px}
.catrow{display:grid;grid-template-columns:90px 1fr 44px;gap:10px;align-items:center;font-size:13px;font-weight:600}
.catrow .num{text-align:right;color:var(--muted)}
.empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:14px}

/* Profile */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);text-align:left;width:100%}
.li:first-child{border-top:0}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600}
.li .tx span{font-size:12px;color:var(--muted)}
.li .val{font-size:13px;color:var(--muted);font-weight:600}
.danger b{color:var(--l4)}
.note{font-size:12px;color:var(--muted);line-height:1.55}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none}
.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}
.tabs a[aria-current="page"]{color:var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .25s ease;box-shadow:var(--shadow)}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:32px;text-transform:uppercase}
.rxgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.rxbox{background:var(--surface-2);border-radius:var(--r-sm);padding:12px}
.rxbox .v{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.rxbox.tgt{background:var(--accent-soft)}
.rxbox.tgt .v{color:var(--accent)}
.steps{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.warnl{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.warnl li{display:flex;gap:8px;font-size:14px}
.warnl li::before{content:"×";color:var(--l4);font-weight:700}
.sheet h3{font-size:15px;font-family:var(--f-body);font-weight:700;margin-top:16px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.lock{color:var(--muted)}
.pill.cur{background:var(--accent-soft);color:var(--accent)}

/* Workout overlay */
.wo{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.wo-in{max-width:520px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.wo-top{display:flex;align-items:center;gap:12px}
.wo-top .x{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.wo-top .x svg{width:18px;height:18px;stroke:var(--fg)}
.prog{flex:1;display:flex;gap:4px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--surface-2)}
.prog i.d{background:var(--accent)}
.prog i.c{background:color-mix(in srgb,var(--accent) 50%,var(--surface-2))}
.wo-timer{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.wo-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;overflow-y:auto;padding:16px 0;min-height:0}
.wo-body h2{font-size:42px;text-transform:uppercase}
.setdots{display:flex;gap:8px;margin-top:10px}
.setdots i{width:34px;height:6px;border-radius:4px;background:var(--surface-2)}
.setdots i.d{background:var(--ok)}
.setdots i.c{background:var(--accent)}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(96px,32vw,150px);line-height:.9;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.02em}
.big small{font-size:.28em;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:4px}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px}
.stepper button{width:62px;height:62px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.stepper button svg{width:24px;height:24px;stroke:var(--fg);stroke-width:2.5}
.hint{text-align:center;font-size:14px;color:var(--muted)}
.hint b{color:var(--fg)}
.wo-foot{display:flex;flex-direction:column;gap:10px}
.ring{position:relative;width:min(72vw,280px);aspect-ratio:1;max-width:100%;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.ring .in .t{font-family:var(--f-display);font-weight:700;font-size:clamp(56px,18vw,84px);line-height:1;font-variant-numeric:tabular-nums}
.ring .in .l{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;margin-top:4px}
.ring .in .s{font-size:13px;color:var(--muted);margin-top:2px}
.nextup{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.nextup .tx{flex:1;min-width:0}
.nextup b{display:block}
.nextup span{font-size:12px;color:var(--muted)}

/* Kegel guided */
.orb-wrap{display:grid;place-items:center;padding:8px 0}
.orb{width:min(66vw,250px);aspect-ratio:1;max-width:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:color-mix(in srgb,var(--pelvic) 14%,transparent);border:2px solid color-mix(in srgb,var(--pelvic) 45%,transparent);transition:transform .9s cubic-bezier(.3,.7,.3,1),background .4s;padding:20px}
.orb.contract,.orb.hold{transform:scale(.78);background:color-mix(in srgb,var(--pelvic) 36%,transparent)}
.orb.relax,.orb.rest{transform:scale(1)}
.orb.breath{transform:scale(1.06)}
.orb .t{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.orb .l{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;margin-top:4px}
.orb .s{font-size:12px;color:var(--muted)}

/* Summary */
.sum-h{text-align:center}
.sum-h .badge{width:72px;height:72px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
.sum-h .badge svg{width:34px;height:34px;stroke:var(--accent-ink);stroke-width:3;fill:none}
.sum-h h2{font-size:40px}
.unlock{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.unlock svg{width:22px;height:22px;stroke:var(--ok);flex:none}

/* Onboarding */
.ob{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.ob-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-height:100%}
.ob h1{font-size:52px;text-transform:uppercase;line-height:.95}
.ob h1 span{color:var(--accent)}
.field{display:grid;grid-template-columns:1fr 132px;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.field label b{display:block;font-weight:600}
.field label span{font-size:12px;color:var(--muted)}
.mini-step{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:10px;padding:4px}
.mini-step button{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:20px;font-weight:700}
.mini-step input{width:44px;border:0;background:transparent;text-align:center;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--fg);-moz-appearance:textfield}
.mini-step input::-webkit-outer-spin-button,.mini-step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lvpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lvpick button{padding:14px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);text-align:left}
.lvpick button b{display:block;font-family:var(--f-display);font-size:22px;text-transform:uppercase}
.lvpick button span{font-size:12px;color:var(--muted)}
.lvpick button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:var(--shadow);animation:up .25s;max-width:calc(100% - 32px);text-align:center}


/* Animasi gerakan */
.anim{position:relative;width:100%;aspect-ratio:200/136;max-width:100%;border-radius:var(--r);background:linear-gradient(180deg,var(--surface-2),color-mix(in srgb,var(--surface-2) 40%,var(--surface)));overflow:hidden;margin:4px 0 12px}
.anim-svg{display:block;width:100%;height:100%}
.anim::after{content:"Animasi";position:absolute;left:10px;top:8px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.anim-wo{margin:0 auto;max-height:30vh;width:auto;max-width:100%;background:var(--surface)}
.anim-wo::after{content:none}

/* Panduan otot dasar panggul */
.pfd{margin:14px 0 4px;padding:10px 10px 12px;border-radius:var(--r);background:var(--surface-2)}
.pfd svg{display:block;width:100%;height:auto}
.pfd-cap{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;fill:var(--pelvic)}
.pfd-lbl{font-size:9.5px;font-weight:700;letter-spacing:.06em;fill:var(--muted)}
.pfd-bone{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.pfd-bone-line{fill:none;stroke:var(--muted);stroke-width:7;stroke-linecap:round}
.pfd-ghost{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:4 4}
.pfd-muscle{fill:none;stroke:var(--pelvic);stroke-width:9;stroke-linecap:round}
.pfd-arrow{fill:none;stroke:var(--fg);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s}
.pfd-k1{fill:var(--l2);background:var(--l2)}
.pfd-k2{fill:var(--accent);background:var(--accent)}
.pfd-k3{fill:var(--l3);background:var(--l3)}
.pfd figcaption{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin-top:6px;font-size:12px;color:var(--muted);font-weight:600}
.pfd figcaption span{display:inline-flex;align-items:center;gap:6px}
.pfd figcaption i,.zone > i{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}
.zones{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.zone{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2)}
.zone > i{margin-top:6px}
.zone div{min-width:0}
.zone b{display:block;font-size:14px}
.zone span{font-size:13px;color:var(--muted)}
.zone span b{display:inline;color:var(--fg);font-size:13px}
.checks{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}

/* Program Kontrol */
.kh h1{margin-top:6px}
.kh3{font-size:12px!important;font-family:var(--f-body)!important;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:16px!important}
.ktl{display:grid;grid-template-columns:repeat(12,1fr);gap:3px 3px;margin-top:16px}
.ktl i{height:8px;border-radius:3px;background:color-mix(in srgb,var(--c) 22%,var(--surface-2))}
.ktl i.past{background:var(--c)}
.ktl i.now{background:var(--c);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fg)}
.ktl span{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kweek{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--muted)}
.kweek b{font-size:18px;color:var(--fg)}
.kcheck{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.kcheck .tx{flex:1;min-width:0}
.kcheck .tx b{display:block}
.kcheck .tx span{font-size:12px;color:var(--muted)}
.kscore{font-size:40px;font-weight:700;line-height:1;min-width:64px}
.kscore small{font-size:15px;color:var(--muted)}
.kres{display:flex;align-items:center;gap:14px;margin-top:10px;padding:14px;border-radius:var(--r);background:var(--surface-2)}
.kq{margin-top:18px}
.kq > b{display:flex;gap:8px;align-items:baseline;font-size:15px;margin-bottom:8px}
.kq > b .num{color:var(--pelvic);font-size:16px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:10px;background:var(--surface-2);border:1.5px solid transparent;font-size:14px;font-weight:500}
.opts button::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex:none}
.opts button[aria-checked="true"]{border-color:var(--pelvic);background:color-mix(in srgb,var(--pelvic) 12%,var(--surface-2))}
.opts button[aria-checked="true"]::before{border-color:var(--pelvic);background:var(--pelvic);box-shadow:inset 0 0 0 3px var(--surface-2)}
.ascale{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:14px 0 6px}
.ascale i{height:30px;border-radius:5px;display:grid;place-items:center;font-style:normal}
.ascale i b{font-family:var(--f-display);font-size:14px;color:var(--bg)}
.z1{background:var(--l1)} .z2{background:var(--l2)} .z3{background:var(--l3)} .z4{background:var(--l4)}
.ascale-k{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);font-weight:600}
.ascale-k span{display:inline-flex;align-items:center;gap:5px}
.ascale-k i{width:8px;height:8px;border-radius:2px;display:inline-block}
.klist{gap:10px}
.kred{border-color:color-mix(in srgb,var(--l4) 45%,var(--line))}
.evs{display:flex;flex-direction:column;gap:10px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ev-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ev-h b{font-size:15px}
.ev p{margin:8px 0 0;font-size:14px}
.ev-l{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
.ev-l a{color:var(--accent);font-size:13px;font-weight:700;text-decoration:none}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
